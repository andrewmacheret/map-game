<!DOCTYPE html>
<html lang="en-US">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<!-- No analytics.js here, so the daily canary doesn't count as a visit -->
<title>World Indicators Guessing Game health check</title>
<style>body { font-family: system-ui, sans-serif; margin: 2rem; } li { margin: 0.25rem 0; }</style>
<script src="https://andrewmacheret.com/healthcheck.js"></script>
</head>
<body>
<h1>World Indicators Guessing Game health check</h1>
<script>
// The page loads Highmaps from jsDelivr, so the page check covers it
healthcheck([
  { name: 'Page', url: '../', assets: true, contains: 'World Indicators Guessing Game' },
  { name: 'World Bank API', url: 'https://api.worldbank.org/v2/country/US?format=json', contains: 'United States' },
  { name: 'World map', url: 'https://cdn.jsdelivr.net/npm/@highcharts/map-collection@2.3.3/custom/world.geo.json', contains: 'FeatureCollection' },
  { name: 'Flags', url: 'https://flagcdn.com/24x18/us.png', image: true }
]);
</script>
</body>
</html>
